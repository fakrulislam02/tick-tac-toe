<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tic Tac Toe</title>
<style>
  :root{
    --bg: #0f1724;
    --card: #0b1220;
    --accent: #06b6d4;
    --x-color: #ef4444;
    --o-color: #60a5fa;
    --muted: #94a3b8;
    --win: #16a34a;
  }

  *{box-sizing:border-box}
  html,body{
    height:100%;
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,#071029 0%, #081022 60%);
    color: #e6eef6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .board-wrap{
    width:100%;
    max-width:480px;
    background: linear-gradient(180deg,var(--card), #071428);
    border-radius:14px;
    padding:20px;
    box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.03);
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:14px;

    
  }

  h1{
    font-size:20px;
    margin:0;
    letter-spacing:0.2px;
  }

  .sub{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
  }

  .controls{
    display:flex;
    gap:8px;
    align-items:center;
  }

  .status{
    padding:8px 12px;
    background: rgba(255,255,255,0.02);
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.02);
    font-weight:600;
    font-size:14px;
  }

  .btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.06);
    color:inherit;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    transition: all .16s ease;
  }

  .btn:hover{ transform: translateY(-2px); box-shadow:0 6px 18px rgba(3,7,18,0.5)}
  .btn:active{ transform:none }

  .grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    padding:14px;
    background: linear-gradient(180deg, rgba(6,11,20,0.15), rgba(6,11,20,0.05));
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.02);
  }

  .cell{
    background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
    aspect-ratio: 1 / 1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color: #dbeafe;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    transition: transform .08s ease, box-shadow .08s ease;
    box-shadow: 0 4px 16px rgba(2,6,23,0.35);
    position:relative;
  }

  .cell:hover{ transform: translateY(-4px) }
  .cell.disabled{ cursor:default; opacity:0.95; transform:none }
  .cell.x{ color: var(--x-color); font-weight:800; }
  .cell.o{ color: var(--o-color); font-weight:800; }

  /* highlight winning cells */
  .cell.win {
    outline: 3px solid rgba(22,163,74,0.18);
    box-shadow: 0 8px 30px rgba(22,163,74,0.12);
  }

  .small{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    text-align:center;
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:10px;
  }

  .score{
    display:flex;
    gap:8px;
    align-items:center;
    font-size:14px;
    color:var(--muted);
  }

  .badge{
    padding:6px 8px;
    border-radius:8px;
    background: rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.02);
    font-weight:700;
  }

  @media (max-width:420px){
    .cell{ font-size:36px }
    .board-wrap{ padding:14px }
  }
</style>
</head>
<body>
  <div class="board-wrap" role="application" aria-label="Tic Tac Toe">
    <header>
      <div>
        <h1>Tic Tac Toe</h1>
        <div class="sub">Classic 2-player game — X goes first</div>
      </div>

      <div class="controls">
        <div id="status" class="status" aria-live="polite">Player X's turn</div>
        <button id="reset" class="btn" title="Reset game">Reset</button>
      </div>
    </header>

    <main>
      <div id="grid" class="grid" aria-label="Game board">
        <!-- 9 cells injected by JS -->
      </div>

      <div class="small" id="message">Click a cell to play. First to connect 3 wins.</div>
    </main>

    <footer>
      <div class="score">
        <span class="badge">X: <span id="score-x">0</span></span>
        <span class="badge">O: <span id="score-o">0</span></span>
      </div>
      <div style="color:var(--muted);font-size:13px">Built with ❤️ — local play</div>
    </footer>
  </div>

<script>
/*
  Tic Tac Toe (2-player)
  - X starts
  - Click a cell to place mark
  - Detects win, draw
  - Highlights winning cells
  - Reset button to start new round (keeps scoreboard)
*/

(function(){
  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const msgEl = document.getElementById('message');
  const resetBtn = document.getElementById('reset');
  const scoreXEl = document.getElementById('score-x');
  const scoreOEl = document.getElementById('score-o');

  const WIN_COMBOS = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
  ];

  let board = Array(9).fill(null); // null, 'X' or 'O'
  let current = 'X';
  let running = true;
  let scores = { X: 0, O: 0 };

  // create cells
  function initGrid(){
    gridEl.innerHTML = '';
    for(let i=0;i<9;i++){
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.setAttribute('data-index', i);
      cell.setAttribute('aria-label', `Cell ${i+1}`);
      cell.addEventListener('click', onCellClick);
      cell.addEventListener('keydown', onCellKeyDown);
      gridEl.appendChild(cell);
    }
  }

  function onCellKeyDown(e){
    // allow Enter/Space to mark for accessibility
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      e.target.click();
    }
  }

  function onCellClick(e){
    if(!running) return;
    const idx = Number(e.currentTarget.dataset.index);
    if(board[idx] !== null) return; // occupied

    makeMove(idx, current);
    render();

    // check win/draw
    const res = checkWinner();
    if(res.winner){
      running = false;
      highlightWin(res.combo);
      statusEl.textContent = `Player ${res.winner} wins!`;
      msgEl.textContent = `Nice! Player ${res.winner} connected 3.`;
      scores[res.winner]++;
      updateScores();
    } else if(board.every(Boolean)){
      running = false;
      statusEl.textContent = `It's a draw`;
      msgEl.textContent = `No winners this round — try again.`;
    } else {
      // switch player
      current = current === 'X' ? 'O' : 'X';
      statusEl.textContent = `Player ${current}'s turn`;
      msgEl.textContent = `Waiting for player ${current}...`;
    }
  }

  function makeMove(index, player){
    board[index] = player;
  }

  function checkWinner(){
    for(const combo of WIN_COMBOS){
      const [a,b,c] = combo;
      if(board[a] && board[a] === board[b] && board[a] === board[c]){
        return { winner: board[a], combo };
      }
    }
    return { winner: null, combo: null };
  }

  function highlightWin(combo){
    if(!combo) return;
    combo.forEach(i => {
      const cell = gridEl.querySelector(`[data-index="${i}"]`);
      cell.classList.add('win');
    });
    // mark all winning cells with the winner class
    const winner = board[combo[0]];
    combo.forEach(i => {
      const c = gridEl.querySelector(`[data-index="${i}"]`);
      c.classList.add(winner === 'X' ? 'x' : 'o');
    });
    // disable all cells
    disableAllCells();
  }

  function disableAllCells(){
    const cells = gridEl.querySelectorAll('.cell');
    cells.forEach(cell => {
      cell.classList.add('disabled');
      cell.disabled = true;
    });
  }

  function updateScores(){
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
  }

  function render(){
    const cells = gridEl.querySelectorAll('.cell');
    cells.forEach(cell => {
      const idx = Number(cell.dataset.index);
      const val = board[idx];
      cell.textContent = val || '';
      cell.classList.remove('x','o');
      if(val) cell.classList.add(val === 'X' ? 'x' : 'o');
      // disable clicked ones to prevent focus issues
      cell.disabled = !!val || !running;
      cell.classList.toggle('disabled', !!val || !running);
    });
  }

  function resetBoard(keepScores = true){
    board = Array(9).fill(null);
    current = 'X';
    running = true;
    statusEl.textContent = `Player X's turn`;
    msgEl.textContent = `Click a cell to play. First to connect 3 wins.`;
    // remove win highlight
    const cells = gridEl.querySelectorAll('.cell');
    cells.forEach(cell => {
      cell.classList.remove('win','x','o','disabled');
      cell.disabled = false;
      cell.textContent = '';
    });
    if(!keepScores){
      scores = { X:0, O:0 };
      updateScores();
    }
  }

  // reset button: single click resets board; shift+click resets scoreboard too
  resetBtn.addEventListener('click', (e) => {
    const keep = !e.shiftKey; // hold Shift to clear scores
    if(!keep){
      // confirm clear scores when shift-click
      if(!confirm('Clear scoreboard and reset game?')) return;
    }
    resetBoard(keep);
  });

  // init
  initGrid();
  resetBoard(true);
  updateScores();

  // expose for dev console (optional)
  window.__tic = { resetBoard, board, get current(){return current}, scores };
})();
</script>
</body>
</html>
